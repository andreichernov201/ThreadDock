# docker compose -f compose.yaml -f compose.vps.yaml up -d --build
services:
  bot:
    environment:
      ARCHIVE_PUBLIC_URL: https://${ARCHIVE_DOMAIN:?Set ARCHIVE_DOMAIN in .env}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ARCHIVE_DOMAIN: ${ARCHIVE_DOMAIN:?Set ARCHIVE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
