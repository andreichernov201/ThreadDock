[project]
name = "threaddock"
version = "0.1.0"
description = "Telegram media downloader and isolated Business message archive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "aiohttp>=3.14,<4",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
media = [
    "gallery-dl==1.32.20",
    "yt-dlp[default,curl-cffi]==2026.10.26",
]

[project.urls]
Repository = "https://github.com/andreichernov201/ThreadDock"
Issues = "https://github.com/andreichernov201/ThreadDock/issues"

[dependency-groups]
dev = ["ruff==0.17.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
