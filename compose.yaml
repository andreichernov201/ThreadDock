services:
  bot:
    image: threaddock:local
    build:
      context: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      ARCHIVE_HOST: 0.0.0.0
      ARCHIVE_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - threaddock-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  threaddock-data:
