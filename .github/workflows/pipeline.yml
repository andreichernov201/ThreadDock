name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    concurrency:
      group: compatibility-${{ matrix.os }}-${{ matrix.python }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py
  test:
    name: Media and web integration
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          version: "0.13.9"
          enable-cache: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "v2.9.8"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked --extra media
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run --locked --extra media python scripts/check.py --full
      - name: Save archive screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-ui
          path: ${{ runner.temp }}/threaddock-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: for file in scripts/*.sh; do bash -n "$file"; done
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: ARCHIVE_DOMAIN=archive.example.org docker compose -f compose.yaml -f compose.vps.yaml config --quiet
      - run: THREDDOCK_IMAGE=threaddock:ci docker compose -f compose.production.yaml config --quiet
      - run: ARCHIVE_DOMAIN=archive.example.org THREDDOCK_IMAGE=threaddock:ci docker compose -f compose.production.yaml --profile web config --quiet
  image:
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: threaddock:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=threaddock-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=threaddock-amd64' || '' }}
      - name: Verify runtime as the container user
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=256m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true
          threaddock:ci python main.py --check --no-token
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$repository:$GITHUB_SHA"
          docker tag threaddock:ci "$tag"
          docker push "$tag"
          reference=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | awk -v prefix="$repository@" 'index($0,prefix)==1 {print;exit}')
          [[ "$reference" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
  development:
    name: Development container
    concurrency:
      group: development-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: threaddock:dev
          cache-from: type=gha,scope=threaddock-dev
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=threaddock-dev' || '' }}
      - name: Run checks inside the development environment
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace threaddock:dev sh -ec '
            uv sync --locked --extra media
            npm ci
            npx playwright install --with-deps chromium
            uv run --locked --extra media python scripts/check.py --full
          '
  deploy:
    needs: [compatibility, test, image, development]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: production
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the tested commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { printf '::error::%s\n' "$1" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'Invalid commit SHA.'
          [[ "$IMAGE_REFERENCE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || fail 'Missing or invalid image digest.'
          [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9_-]+(\[bot\])?$ ]] || fail 'Invalid GitHub registry username.'
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || fail 'VPS_HOST must contain only the server IP or hostname, without spaces or a URL scheme.'
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || fail 'VPS_USER must contain only the Linux deployment username.'
          VPS_PORT=${VPS_PORT:-22}
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || fail 'VPS_PORT must be an integer between 1 and 65535.'
          (( VPS_PORT > 0 && VPS_PORT < 65536 )) || fail 'VPS_PORT must be an integer between 1 and 65535.'
          test -n "$SSH_PRIVATE_KEY" || fail 'Missing SSH_PRIVATE_KEY in the production environment.'
          test -n "$SSH_KNOWN_HOSTS" || fail 'Missing SSH_KNOWN_HOSTS in the production environment (not VPS_KNOWN_HOSTS).'
          trap 'printf "::error::Deployment failed at script line %s (exit %s).\n" "$LINENO" "$?" >&2' ERR
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          cat > "$RUNNER_TEMP/deploy-ssh/config" <<EOF
          Host deploy
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile $RUNNER_TEMP/deploy-ssh/key
            UserKnownHostsFile $RUNNER_TEMP/deploy-ssh/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
          EOF
          trap 'rm -rf -- "$RUNNER_TEMP/deploy-ssh"' EXIT
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deploy "mkdir -p /opt/threaddock/releases/$GITHUB_SHA"
          scp -F "$RUNNER_TEMP/deploy-ssh/config" "$RUNNER_TEMP/source.tar.gz" "deploy:/opt/threaddock/releases/$GITHUB_SHA/source.tar.gz"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deploy "set -eu; cd /opt/threaddock/releases/$GITHUB_SHA; tar -xzf source.tar.gz"
          printf '%s' "$REGISTRY_TOKEN" | ssh -F "$RUNNER_TEMP/deploy-ssh/config" deploy "cd /opt/threaddock/releases/$GITHUB_SHA; bash scripts/deploy.sh $GITHUB_SHA $IMAGE_REFERENCE $REGISTRY_USER $VPS_HOST"
          archive_url=$(ssh -F "$RUNNER_TEMP/deploy-ssh/config" deploy "cat /opt/threaddock/shared/web-origin")
          [[ "$archive_url" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:443)?$ ]] || fail 'Invalid archive HTTPS origin.'
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 3 "$archive_url/healthz"
          curl --fail --silent --show-error --max-time 20 "$archive_url/" -o "$RUNNER_TEMP/archive.html"
          grep -q '/assets/app.js' "$RUNNER_TEMP/archive.html" || fail 'Archive HTML did not load.'
          for asset in app.js style.css texts.js; do
            curl --fail --silent --show-error --max-time 20 "$archive_url/assets/$asset" -o /dev/null
          done
          auth_status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$archive_url/api/session")
          [[ "$auth_status" == 401 ]] || fail 'Archive API must require Telegram authentication.'
          printf '\nExternal archive checks passed: HTML, assets, HTTPS and API authentication.\n'
          printf 'Deployed commit `%s` to production.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
