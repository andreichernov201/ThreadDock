name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          version: "0.11.23"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "v2.9.7"
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run python -m unittest discover -s tests -v
      - run: uvx --from ruff==0.16.7 ruff check .
      - run: uvx --from ruff==0.16.7 ruff format --check .
      - run: deno fmt --check --no-config archive/web tests/web_test.js
      - run: deno test --no-config --allow-read=archive/web tests/web_test.js
      - run: bash -n scripts/deploy.sh
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: ARCHIVE_DOMAIN=archive.example.org docker compose -f compose.yaml -f compose.vps.yaml config --quiet
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --tag threaddock:ci .
  deploy:
    needs: [test, image]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deploy the tested commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          VPS_PORT=${VPS_PORT:-22}
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] && (( VPS_PORT > 0 && VPS_PORT < 65536 ))
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          cat > "$RUNNER_TEMP/deploy-ssh/config" <<EOF
          Host deploy
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile $RUNNER_TEMP/deploy-ssh/key
            UserKnownHostsFile $RUNNER_TEMP/deploy-ssh/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
          EOF
          trap 'rm -rf -- "$RUNNER_TEMP/deploy-ssh"' EXIT
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deploy "mkdir -p /opt/threaddock/releases/$GITHUB_SHA"
          scp -F "$RUNNER_TEMP/deploy-ssh/config" "$RUNNER_TEMP/source.tar.gz" "deploy:/opt/threaddock/releases/$GITHUB_SHA/source.tar.gz"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deploy "set -eu; cd /opt/threaddock/releases/$GITHUB_SHA; tar -xzf source.tar.gz; bash scripts/deploy.sh $GITHUB_SHA"
          printf 'Deployed commit `%s` to production.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
